<ion-header class="auth-header">
  <ion-toolbar>
    <ion-title>EleccionesEPN</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-content">
  <div class="auth-shell">
    <div class="auth-hero">
      <h1 class="auth-title">Recuperar contraseña</h1>
    </div>

    @if (mensaje()) {
    <ion-text class="auth-alert auth-alert--success" color="success" role="status">
      <p>{{ mensaje() }}</p>
    </ion-text>
    <ion-button class="auth-submit" expand="block" routerLink="/login">Volver al inicio</ion-button>
    } @else {
    <form class="auth-form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <ion-input
        formControlName="cedula"
        label="Cédula"
        labelPlacement="stacked"
        fill="outline"
        inputmode="numeric"
        maxlength="10"
        errorText="Ingrese una cédula válida."
        [class.ion-invalid]="form.controls.cedula.touched && form.controls.cedula.invalid"
        [class.ion-touched]="form.controls.cedula.touched"
      />

      @if (error()) {
      <ion-text class="auth-alert auth-alert--danger" color="danger" role="alert">
        <p>{{ error() }}</p>
      </ion-text>
      }

      <ion-button class="auth-submit" type="submit" expand="block" [disabled]="cargando()">
        @if (cargando()) {
        <ion-spinner name="crescent" aria-label="Enviando" />
        } @else { Enviar correo }
      </ion-button>
      <ion-button class="auth-link" fill="clear" expand="block" routerLink="/login">Cancelar</ion-button>
    </form>
    }
  </div>
</ion-content>
