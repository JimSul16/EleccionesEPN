<ion-header>
  <ion-toolbar>
    <ion-title>Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>Por seguridad, cambie la contraseña inicial antes de continuar.</p>

  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate>
    <ion-input
      formControlName="nueva"
      type="password"
      label="Nueva contraseña"
      labelPlacement="stacked"
      fill="outline"
      autocomplete="new-password"
    />
    <ion-input
      formControlName="confirmacion"
      type="password"
      label="Repita la contraseña"
      labelPlacement="stacked"
      fill="outline"
      autocomplete="new-password"
    />

    @if (pendientes().length > 0) {
    <ul aria-live="polite">
      @for (p of pendientes(); track p) {
      <li>{{ p }}</li>
      }
    </ul>
    } @if (error()) {
    <ion-text color="danger" role="alert">
      <p>{{ error() }}</p>
    </ion-text>
    }

    <ion-button type="submit" expand="block" [disabled]="cargando() || pendientes().length > 0">
      @if (cargando()) {
      <ion-spinner name="crescent" aria-label="Guardando" />
      } @else { Guardar }
    </ion-button>
  </form>
</ion-content>
