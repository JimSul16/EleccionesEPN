<ion-header class="auth-header">
  <ion-toolbar>
    <ion-title>EleccionesEPN</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="auth-content">
  <div class="auth-shell">
    <div class="auth-hero">
      <h1 class="auth-title">Cambiar contraseña</h1>
      <p class="auth-lead">Por seguridad, cambie la contraseña inicial antes de continuar.</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="guardar()" novalidate>
      <ion-input
        formControlName="nueva"
        type="password"
        label="Nueva contraseña"
        labelPlacement="stacked"
        fill="outline"
        autocomplete="new-password"
      />
      <ion-input
        formControlName="confirmacion"
        type="password"
        label="Repita la contraseña"
        labelPlacement="stacked"
        fill="outline"
        autocomplete="new-password"
      />

      @if (pendientes().length > 0) {
      <ul class="auth-rules" aria-live="polite">
        @for (p of pendientes(); track p) {
        <li>{{ p }}</li>
        }
      </ul>
      } @if (error()) {
      <ion-text class="auth-alert auth-alert--danger" color="danger" role="alert">
        <p>{{ error() }}</p>
      </ion-text>
      }

      <ion-button class="auth-submit" type="submit" expand="block" [disabled]="cargando() || pendientes().length > 0">
        @if (cargando()) {
        <ion-spinner name="crescent" aria-label="Guardando" />
        } @else { Guardar }
      </ion-button>
    </form>
  </div>
</ion-content>
